services:
  mysql-server:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: test123
      MYSQL_DATABASE: baratito 
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  app:
      build: .
      container_name: baratito

      restart: unless-stopped

      ports:
        - "8080:8080"

      environment:
        DATASOURCE_URL: jdbc:mysql://mysql:3306/baratito
        DATASOURCE_USERNAME: test
        DATASOURCE_PASSWORD: test

volumes:
  mysql_data: